[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
grimora = { path = "crates/grimora" }
grimora_core = { path = "crates/grimora_core" }
grimora_render = { path = "crates/grimora_render" }
grimora_scene = { path = "crates/grimora_scene" }
grimora_physics = { path = "crates/grimora_physics" }
grimora_audio = { path = "crates/grimora_audio" }
grimora_world = { path = "crates/grimora_world" }

wgpu = "30"
winit = { version = "0.30", features = ["serde"] }
glam = { version = "0.34", features = ["bytemuck", "serde"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
hecs = "0.11"
rapier3d = "0.36"
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm", "ogg", "vorbis", "mp3"] }
image = { version = "0.25", default-features = false, features = ["png"] }
gilrs = "0.11"
gltf = { version = "1.4", default-features = false, features = ["import", "utils", "names", "extras", "KHR_materials_emissive_strength"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Dependencies are optimized even in dev builds: a debug wgpu is very slow.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
